<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCC QORGAU</title>
    <style>
        body {
            background: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }
        .card {
            background: #171f33;
            padding: 25px;
            border-radius: 18px;
        }
        textarea {
            box-sizing: border-box;
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #2878ff;
            color: white;
            border: 0;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 15px;
        }
        #result {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>BCC QORGAU</h1>
    <p>Your personal financial security assistant</p>

    <div class="card">
        <h2>Check suspicious message</h2>
        <p>Вставь подозрительное SMS или сообщение:</p>

        <textarea id="message"
            placeholder="Вставьте сообщение сюда..."></textarea>

        <br>
        <button onclick="analyze()">Analyze message</button>

        <div id="result"></div>
    </div>

    <script>
        async function analyze() {
            const message = document.getElementById("message").value;
            const result = document.getElementById("result");

            if (!message.trim()) {
                result.innerText = "Введите сообщение.";
                return;
            }

            result.innerText = "Analyzing...";

            try {
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({message})
                });

                const data = await response.json();

                result.innerHTML =
                    "<h3>Risk level: " + data.level + "</h3>" +
                    "<p>Risk score: " + data.score + "/100</p>" +
                    "<p>" + data.advice + "</p>";
            } catch (error) {
                result.innerText = "Connection error. Try again.";
            }
        }
    </script>
</body>
</html>
